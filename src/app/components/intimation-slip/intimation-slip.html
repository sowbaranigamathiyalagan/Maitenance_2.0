<div class="intimation-slip-container">
  <div class="header">
    <h2 class="title">Intimation Slip</h2>
    <button class="close-button" (click)="close()" aria-label="Close modal">
      <img src="assets/icons/close.svg" alt="close" />
    </button>
  </div>

  <div class="form-grid">
    <div class="field">
      <label for="machineNumber">Machine Number</label>
      <input
        pInputText
        id="machineNumber"
        [(ngModel)]="formData.machineNumber"
        placeholder="Enter Machine Number"
      />
    </div>

    <div class="field">
      <label for="moldNumber">Mold Number</label>
      <input
        pInputText
        id="moldNumber"
        [(ngModel)]="formData.moldNumber"
        placeholder="Enter Mold Number"
      />
    </div>

    <div class="field">
      <label for="moldName">Mold Name</label>
      <input
        pInputText
        id="moldName"
        [(ngModel)]="formData.moldName"
        placeholder="Enter Mold Name"
      />
    </div>

    <div class="field">
      <label for="timeDuration">Time Duration</label>
      <input
        pInputText
        id="timeDuration"
        [(ngModel)]="formData.timeDuration"
        placeholder="Enter Duration (e.g. 4 months)"
      />
    </div>

    <div class="field">
      <label for="materialName">Material name</label>
      <p-select
        [options]="materials"
        [(ngModel)]="formData.materialName"
        optionLabel="label"
        placeholder="Select material"
        id="materialName"
        appendTo="body"
      ></p-select>
    </div>

    <div class="field">
      <label for="shift">Shift</label>
      <p-select
        id="shift"
        [options]="shifts"
        [(ngModel)]="formData.shift"
        optionLabel="label"
        placeholder="Select Shift"
      ></p-select>
    </div>

    <div class="field">
      <label for="department">Department</label>
      <p-select
        id="department"
        [options]="departments"
        [(ngModel)]="formData.department"
        optionLabel="label"
        placeholder="Select Department"
      ></p-select>
    </div>

    <div class="field">
      <label for="category">Category</label>
      <p-select
        id="category"
        [options]="categories"
        [(ngModel)]="formData.category"
        optionLabel="label"
        placeholder="Select Category"
        (onChange)="onCategoryChange()"
      ></p-select>
    </div>

    <div class="field full-width">
      <div class="desc-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <label for="problemDesc" style="margin-bottom: 0;">Problem desc</label>
        @if (savedDescriptions.length > 0) {
          <div style="display: flex; gap: 8px; align-items: center;">
            <p-select
              [options]="savedDescriptions"
              [(ngModel)]="selectedSavedDescription"
              optionLabel="description"
              placeholder="Select a saved description..."
              (onChange)="onSavedDescChange()"
              [style]="{'width': '300px'}"
            ></p-select>
            <p-button 
              icon="pi pi-trash" 
              severity="danger" 
              [text]="true" 
              [rounded]="true" 
              (click)="deleteDescription()" 
              [disabled]="!selectedSavedDescription"
              pTooltip="Delete selected description"
            ></p-button>
          </div>
        }
      </div>
      <div class="textarea-wrap" style="position: relative;">
        <textarea
          pTextarea
          id="problemDesc"
          [(ngModel)]="formData.problemDesc"
          rows="4"
          placeholder="Describe the problem observed..."
        ></textarea>
        <p-button 
          label="Save" 
          icon="pi pi-save" 
          size="small"
          severity="secondary"
          [text]="true"
          (click)="saveDescription()"
          styleClass="save-desc-btn"
          [style]="{'position': 'absolute', 'bottom': '8px', 'right': '8px', 'background': '#f8fafc'}"
          pTooltip="Save description to current category"
        ></p-button>
      </div>
    </div>
  </div>

  <div class="footer">
    <button pButton label="Send" class="send-btn" (click)="send()"></button>
  </div>
</div>
