<div class="layout">

  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="left">
        <span class="title">MAINTENANCE 2.0</span>
        <img src="/assets/logo.png" alt="Logo" class="main-logo" />
      </div>

      <div class="right">
        <button class="theme-toggle-btn" (click)="themeService.toggleTheme()" title="Toggle Theme">
          <i class="pi" [ngClass]="themeService.isDarkMode() ? 'pi-sun' : 'pi-moon'"></i>
        </button>
        <div class="user-badge" (click)="menu.toggle($event)" style="cursor: pointer;">
          <div class="avatar">{{ userName.charAt(0).toUpperCase() }}</div>
          <span class="name">Hi, {{ userName }}</span>
          <i class="pi pi-angle-down" style="font-size: 0.8rem; margin-left: 4px; color: #64748b;"></i>
        </div>
        <p-menu #menu [model]="userMenuItems" [popup]="true" appendTo="body"></p-menu>
      </div>

    </div>

    <!-- CONTENT -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
