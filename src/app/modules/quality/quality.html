<div class="quality-container">
  <div class="tabs">
    <button
      class="tab-btn"
      [class.active]="activeTab === 'approve'"
      (click)="setTab('approve')"
    >
      Approve/ Review
    </button>
    <button
      class="tab-btn outline"
      [class.active]="activeTab === 'dispatch'"
      (click)="setTab('dispatch')"
    >
      Awaiting Dispatch
    </button>
  </div>

  <div class="table-card">
    <p-table [value]="qualityData" class="custom-table" [loading]="loading">
      <ng-template pTemplate="header">
        <tr>
          <th>Date</th>
          <th>Machine Name</th>
          <th>Mold Name</th>
          <th>Category</th>
          <th>Description</th>
          <th>Status</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.date_created | date: 'dd/MM/yy' }}</td>
          <td>{{ item.tool_code }}</td>
          <td>{{ item.tool_name }}</td>
          <td>{{ item.category }}</td>
          <td>{{ item.problem_observed }}</td>
          <td>
            <p-button
              *ngIf="item.status === 'REQUESTED'"
              label="Approve"
              class="approve-btn"
              (onClick)="approveRow(item)"
            ></p-button>
            <span *ngIf="item.status !== 'REQUESTED'" class="status-label">{{ item.status }}</span>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center">No intimations found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
